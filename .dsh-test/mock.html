<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>翼课网 mock 作业页</title>
<style>
  body { font-family: system-ui, "Microsoft YaHei", sans-serif; margin: 0; padding: 24px; }
  .tile { border: 1px solid #ddd; border-radius: 6px; padding: 12px 16px; margin: 10px 0; }
  .tile h3 { margin: 0 0 6px; font-size: 16px; }
  .tile a { color: #0a66c2; }
  #jsDoWorkCompContainer { position: fixed; inset: 12px; background: #fff;
    border: 2px solid #333; border-radius: 8px; overflow: auto; padding: 20px; z-index: 9999; }
  .jsDoHwFill { display: inline-block; min-width: 90px; border-bottom: 1px solid #999; color: #0a66c2; }
  .q { margin: 10px 0 18px; }
  .opts label { margin-right: 24px; font-size: 18px; }
  input[type=radio] { width: 20px; height: 20px; vertical-align: middle; }
  .foot { margin-top: 24px; }
  .foot a, .go { display: inline-block; padding: 8px 22px; background: #0a66c2; color: #fff;
    border-radius: 4px; text-decoration: none; }
  .confirm { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%);
    background: #fff; border: 1px solid #999; padding: 18px 26px; box-shadow: 0 4px 18px rgba(0,0,0,.25); }
  .confirm a { margin-left: 12px; color: #0a66c2; }
</style>
</head>
<body>
<div id="tiles"></div>
<div id="jsDoWorkCompContainer" style="display:none"></div>

<script>
window.avalon = { vmodels: {} };
var TASKS = [];
var ORDER = [];

function renderTiles() {
  var box = document.getElementById('tiles');
  box.innerHTML = TASKS.map(function (t) {
    return '<div class="tile">' +
           '<h3>' + t.name + '</h3>' +
           '<a href="javascript:;" class="go" data-key="' + t.key + '">马上做</a>' +
           '</div>';
  }).join('');
}

function panel() { return document.getElementById('jsDoWorkCompContainer'); }

function openTask(t) {
  var p = panel();
  p.style.display = 'block';
  p.innerHTML =
    '<div class="topic_popBox">' +
      '<div class="startNow">' +
        '<h2>' + t.name + ' 共' + (t.items.length || t.words.length) + '道小题</h2>' +
        '<div class="ready"><a href="javascript:;" id="startBtn">START NOW</a></div>' +
      '</div>' +
    '</div>';
  document.getElementById('startBtn').addEventListener('click', function () { startTask(t); });
}

function startTask(t) {
  var p = panel();
  var vid = 'ms-btk.do.' + t.kind + String(Math.floor(Math.random() * 1e9));
  var vm = { qus_items: [], ansData: null, allData: null, key: t.key, kind: t.kind };

  if (t.kind === 'dictation') {
    vm.allData = t.words.map(function (w) { return { text: w }; });
    vm.state = { idx: 0, got: [] };
    p.innerHTML =
      '<div class="dictbox"><h2>词语听写</h2>' +
      '<p>已填 <span id="dictProgress">0/' + t.words.length + '</span></p>' +
      '<input type="text" id="wordInput" placeholder="输入单词">' +
      '<div class="foot"><a href="javascript:;" id="fin">完成</a></div></div>';
    var inp = document.getElementById('wordInput');
    inp.addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      e.preventDefault();
      vm.state.got.push((inp.value || '').trim());
      inp.value = '';
      vm.state.idx = Math.min(vm.state.idx + 1, t.words.length);
      document.getElementById('dictProgress').textContent = vm.state.idx + '/' + t.words.length;
    });
    inp.focus();
  } else if (t.kind === 'choice') {
    vm.ansData = {};
    t.items.forEach(function (it) { vm.ansData[it.id] = { ans: '' }; });
    vm.qus_items = t.items.map(function (it) {
      return { id: it.id, answer: it.answer, orders: it.orders, ask: [] };
    });
    var html = '<div class="choicebox"><h2>' + t.name + '</h2>';
    t.items.forEach(function (it, i) {
      html += '<div class="q"><p>' + (i + 1) + '. ' + it.ask + '</p><div class="opts">';
      ['A', 'B', 'C', 'D'].forEach(function (L) {
        html += '<label><input type="radio" name="choice_' + it.id + '" value="' + L + '">' + L + '</label>';
      });
      html += '</div></div>';
    });
    html += '<div class="foot"><a href="javascript:;" id="fin">完成</a></div></div>';
    p.innerHTML = html;
    p.querySelectorAll('input[type=radio]').forEach(function (r) {
      r.addEventListener('click', function () {
        vm.ansData[r.name.replace('choice_', '')] = { ans: r.value };
      });
    });
  } else {
    var store = {};
    t.items.forEach(function (it) { store[it.id] = ['']; });
    var html2 = '<div class="fillbox"><h2>' + t.name + '</h2>';
    t.items.forEach(function (it, i) {
      var blank = '<span class="jsDoHwFill" data-qid="' + it.id + '">点击答题</span>';
      var ask = it.ask.indexOf('###') >= 0 ? it.ask.replace('###', blank) : it.ask + ' ' + blank;
      html2 += '<div class="q"><p>' + (i + 1) + '. ' + ask + '</p></div>';
    });
    html2 += '<div class="foot"><a href="javascript:;" id="fin">完成</a></div></div>';
    p.innerHTML = html2;
    // 模拟 avalon 的双向绑定：写 ansData 即刻反映到空上
    vm.ansData = new Proxy(store, {
      set: function (target, key, value) {
        target[key] = value;
        var el = document.querySelector('.jsDoHwFill[data-qid="' + key + '"]');
        if (el) el.textContent = (value && value[0]) || '';
        return true;
      }
    });
    vm.qus_items = t.items.map(function (it) {
      return { id: it.id, answer: it.answer, orders: it.orders, ask: [] };
    });
  }

  avalon.vmodels[vid] = vm;
  window.__lastVm = vm;
  document.getElementById('fin').addEventListener('click', function () { askSubmit(t, vm); });
}

function norm(s) { return String(s == null ? '' : s).trim().toLowerCase(); }

function gradeOf(t, vm) {
  var total = 0, ok = 0;
  if (t.kind === 'choice') {
    t.items.forEach(function (it) {
      total++;
      var want = JSON.parse(it.answer)[0];
      var got = vm.ansData[it.id] && vm.ansData[it.id].ans;
      if (got === want) ok++;
    });
  } else if (t.kind === 'dictation') {
    t.words.forEach(function (w, i) {
      total++;
      if (norm(vm.state.got[i]) === norm(w)) ok++;
    });
  } else {
    t.items.forEach(function (it) {
      total++;
      var want = JSON.parse(it.answer)[0];
      var got = vm.ansData[it.id];
      got = Array.isArray(got) ? got[0] : got;
      if (norm(got) === norm(want)) ok++;
    });
  }
  window.__lastScore = ok + '/' + total;
  if (ok === total) return 'A';
  if (ok * 2 >= total) return 'C';
  return 'D';
}

function askSubmit(t, vm) {
  var p = panel();
  if (location.search.indexOf('broken') >= 0) {
    // 模拟"提交了但页面上没有等级"的异常
    p.innerHTML = '<div class="result"><h2>已提交</h2><p>正在统计</p></div>';
    return;
  }
  var modal = document.createElement('div');
  modal.className = 'confirm';
  modal.innerHTML = '<p>确定要提交吗？</p><a href="javascript:;" id="ok">确定</a>' +
                    '<a href="javascript:;" id="cancel">取消</a>';
  p.appendChild(modal);
  modal.querySelector('#cancel').addEventListener('click', function () { modal.remove(); });
  modal.querySelector('#ok').addEventListener('click', function () {
    modal.remove();
    var g = gradeOf(t, vm);
    if (t.kind === 'dictation') {
      // 真实站点上听写的结果页是「分数 + 答案对照表」，没有等级
      var score = Math.round(100 * (parseInt((window.__lastScore || '0/1').split('/')[0], 10) /
                                    Math.max(1, t.words.length)));
      var rows = t.words.map(function (w, i) {
        return '<tr><td>' + (i + 1) + '</td><td>' + (vm.state.got[i] || '') + '</td><td>' + w + '</td></tr>';
      }).join('');
      p.innerHTML = '<div><h2>词语听写 ' + score + ' 00:00:11</h2>' +
        '<p>绿色是正确答案，红色是错误答案</p>' +
        '<table><tr><th>序号</th><th>我的答案</th><th>正确答案</th></tr>' + rows + '</table></div>';
      return;
    }
    p.innerHTML = '<div class="result"><h2>作业已完成</h2><p>等级：' + g + '</p><p>用时：' +
                  (12 + Math.floor(Math.random() * 40)) + '秒</p></div>';
  });
}

document.addEventListener('click', function (e) {
  var a = e.target.closest && e.target.closest('.go');
  if (!a) return;
  var t = TASKS.filter(function (x) { return x.key === a.getAttribute('data-key'); })[0];
  if (t) openTask(t);
});

fetch('/api/tasks').then(function (r) { return r.json(); }).then(function (list) {
  TASKS = list;
  ORDER = list.map(function (t) { return t.name; });
  avalon.vmodels['hwCntVm'] = {
    list: list.map(function (t, i) {
      return { type_name: t.name, biz: t.biz, key: t.key, type_code: String(100 + i), ids: String(i + 1) };
    })
  };
  renderTiles();
});
</script>
</body>
</html>
